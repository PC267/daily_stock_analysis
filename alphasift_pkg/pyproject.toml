[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphasift-pkg"
version = "0.2.0"
description = "Alphasift 自动选股包 — DSA集成版"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "efinance>=0.4",
    "akshare>=1.10",
    "baostock>=0.8.9",
    "tushare>=1.4",
    "requests>=2.28",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["alphasift*"]
